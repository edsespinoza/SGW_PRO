<!--
  SGW Pro v11.0.0 — Sistema Teste
  CRM/ERP: Controle de Distribuição e Acesso ao Sistema SGW Stellantis
  Módulos: Landing · Dashboard · Licenças · Clientes · Financeiro · Relatórios · Auditoria · Configurações
  Segurança: SHA-256 · AES-256 · HMAC · IndexedDB · UUID Polyfill · Offline-first

  v11.0.0 — Correções:
  · QA-OFF1: loop retry corrigido (off-by-one)
  · BUG-004: rate limiting com Retry-After + jitter
  · A11Y-01: focus ring nos inputs sem accessibility
  · Reconexão de permissão entre sessões (queryPermission / requestPermission)
  · Importação de .txt (parse JSON interno) além do .json legado
  · Fallback gracioso para Firefox/Safari (badge "Não disponível" + JSON mantido)
  · Detecção de IDB bloqueado em múltiplas abas (onblocked handler)

  v9.0 — Melhorias anteriores:
  · Fix memory leak: URL.revokeObjectURL após exportação JSON
  · CSS: keyframes duplicados removidos do Tailwind config (eram dead code)
  · Auto-detecção de status expirado ao salvar licença
  · beforeunload: aviso de dados não salvos ao fechar/navegar
  · Ctrl+P: atalho de teclado para abrir PDF
  · Fld: mensagens de erro específicas por campo (prop errMsg)
  · S.fmtPhone: formatação automática de telefone BR
  · Toast: acessibilidade role="alert" + aria-live
  · CertLink: fallback visual quando QR Code falha
  · delLic: mensagem de confirmação com detalhes da licença
  · Sidebar: role="navigation" + ARIA labels
  · Main: role="main"
  · Nav badges: contador de licenças ativas na sidebar
  · Boot: safe-timeout de 10s para IndexedDB
  · Fontes mínimas: elevadas de 9px → 11px
-->

.s-active{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.25);}

.kpi{background:rgba(13,21,38,.8);border:1px solid rgba(255,255,255,.07);border-radius:1.25rem;padding:1.2rem 1.1rem;transition:background-color .25s ease,border-color .25s ease,transform .2s ease,box-shadow .25s ease;cursor:default;}

.dt{width:100%;border-collapse:collapse;}

.ticker-wrap{overflow:hidden;background:rgba(20,240,212,.05);border-bottom:1px solid rgba(20,240,212,.1);}

const CertPDF = ({
  open,
  close,
  lic,
  screens,
  toast
}) => {
  const [tab, setTab] = useState(1);
  const [gen, setGen] = useState(false);
  const [protect, setProtect] = useState(false);
  const [pwd, setPwd] = useState('');
  const [showPwd, setShowPwd] = useState(false);
  const CY = '#00D4FF';
  const A4 = {
    width: '210mm',
    height: '297mm',
    position: 'relative',
    fontFamily: 'system-ui,sans-serif',
    overflow: 'hidden',
    background: '#060b14'
  };
  const exportPDF = async () => {
    setGen(true);
    try {
      const pages = document.querySelectorAll('.pdf-pg');
      if (!pages.length) {
        alert('Nenhuma página visível');
        setGen(false);
        return;
      }
      const {
        jsPDF
      } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });
      pdf.setProperties({
        title: `Licença SGW - ${lic.customerName || 'Sem nome'}`,
        subject: `Certificado de ativação - Serial: ${lic.licenseKey || '---'}`,
        author: 'Sistema Teste - SGW Pro',
        keywords: 'SGW, licença, certificação, Stellantis',
        creator: 'SGW Pro v11 - jsPDF'
      });
      for (let i = 0; i < Math.min(pages.length, 3); i++) {
        if (i > 0) pdf.addPage();
        const c = await html2canvas(pages[i], {
          scale: 3,
          useCORS: true,
          logging: false,
          backgroundColor: '#060b14',
          allowTaint: true,
          imageTimeout: 15000
        });
        pdf.addImage(c.toDataURL('image/jpeg', .95), 'JPEG', 0, 0, 210, 297);
        pdf.setTextColor(200, 200, 200);
        pdf.setFontSize(40);
        pdf.text('SISTEMA TESTE', 105, 150, {
          align: 'center',
          angle: 45,
          renderingMode: 0
        });
      }
      if (protect && pwd) {
        pdf.encrypt(pwd, pwd);
      }
      pdf.save(`SGW_${(lic.customerName || 'cert').replace(/\s+/g, '_')}_${lic.licenseKey?.slice(-8) || 'doc'}.pdf`);
      if (protect) toast('PDF protegido com senha', 'success');
    } catch (e) {
      alert('Erro ao gerar PDF: ' + e.message);
    }
