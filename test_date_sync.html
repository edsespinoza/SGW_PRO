<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Teste Sincronia Datas SGW Pro</title>
<style>body{font-family:monospace;background:#111;color:#eee;padding:2rem}table{border-collapse:collapse;width:100%}th,td{padding:.5rem 1rem;text-align:left;border:1px solid #333}th{background:#222}.pass{color:#0f0}.fail{color:#f00}h2{margin-top:2rem;color:#0af}.summary{font-size:1.2rem;padding:1rem;background:#1a1a2e;border-radius:8px;margin:1rem 0}</style>
</head>
<body>
<h1>🧪 Teste Sincronia activationDate ↔ validUntil</h1>
<div class="summary" id="summary">Rodando...</div>
<table><thead><tr><th>#</th><th>Cenário</th><th>act old</th><th>exp old</th><th>Ação</th><th>act new</th><th>exp new</th><th>Gap preservado?</th><th>Resultado</th></tr></thead><tbody id="results"></tbody></table>

<script>
const fmt = d => d ? new Date(d + 'T00:00:00').toISOString().split('T')[0] : '—';
const gapDays = (a, b) => a && b ? (new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000 : null;

const T = (desc, actOld, expOld, action, expNewExpected) => {
  const lic = { activationDate: actOld, validUntil: expOld };
  
  // Simula a lógica do onChange de activationDate (linha 3904 corrigida)
  if (action === 'change-act') {
    const nv = '2025-06-15';
    const ov = lic.activationDate;
    lic.activationDate = nv;
    if (!lic.validUntil || !ov) {
      const d = new Date(nv+'T00:00:00');
      d.setFullYear(d.getFullYear() + 1);
      lic.validUntil = d.toISOString().split('T')[0];
    } else {
      const gap = new Date(lic.validUntil+'T00:00:00') - new Date(ov+'T00:00:00');
      const ne = new Date(new Date(nv+'T00:00:00').getTime() + gap);
      lic.validUntil = ne.toISOString().split('T')[0];
    }
  }

  // Simula onChange de validUntil (linha 3909 corrigida)
  if (action === 'change-exp') {
    const nv = '2026-06-15';
    const ov = lic.validUntil;
    lic.validUntil = nv;
    if (lic.activationDate && ov) {
      const gap = new Date(ov+'T00:00:00') - new Date(lic.activationDate+'T00:00:00');
      const na = new Date(new Date(nv+'T00:00:00').getTime() - gap);
      lic.activationDate = na.toISOString().split('T')[0];
    }
  }

  const oldGap = gapDays(actOld, expOld);
  const newGap = gapDays(lic.activationDate, lic.validUntil);
  const gapOk = oldGap === null || newGap === null || oldGap === null ? true : Math.abs(oldGap - newGap) < 1;
  const pass = !expNewExpected || expNewExpected === lic.validUntil;
  
  return { desc, actOld: fmt(actOld), expOld: fmt(expOld), action,
    actNew: fmt(lic.activationDate), expNew: fmt(lic.validUntil),
    gapOk, pass: pass && gapOk };
};

const tests = [
  // activationDate changes
  T('1. Act vazio → preenche act', null, null, 'change-act'),
  T('2. Act preenchido, exp vazio → gera exp', '2025-06-15', null, 'change-act', '2026-06-15'),
  T('3. Ambos preenchidos → mantém gap', '2025-01-01', '2026-01-01', 'change-act'),
  T('4. Gap de 6 meses → mantém', '2025-03-01', '2025-09-01', 'change-act'),
  T('5. Gap de 2 anos → mantém', '2025-01-01', '2027-01-01', 'change-act'),
  T('6. Act futuro → exp futuro mantido', '2026-12-01', '2027-12-01', 'change-act'),

  // validUntil changes
  T('7. Exp mais cedo → act recua', '2025-01-01', '2026-01-01', 'change-exp'),
  T('8. Exp mais tarde → act avança', '2025-01-01', '2026-01-01', 'change-exp'),
  T('9. Gap 90 dias → mantém ao mudar exp', '2025-06-01', '2025-08-30', 'change-exp'),
  T('10. Gap 365 dias → mantém ao mudar exp', '2025-01-01', '2026-01-01', 'change-exp'),
];

let passed = 0, failed = 0;
tests.forEach((t, i) => {
  const ok = t.pass;
  if (ok) passed++; else failed++;
  document.getElementById('results').innerHTML +=
    `<tr class="${ok?'pass':'fail'}">
      <td>${i+1}</td>
      <td>${t.desc}</td>
      <td>${t.actOld}</td>
      <td>${t.expOld}</td>
      <td>${t.action}</td>
      <td>${t.actNew}</td>
      <td>${t.expNew}</td>
      <td>${t.gapOk ? '✅' : '❌'}</td>
      <td>${ok ? '✅ PASSOU' : '❌ FALHOU'}</td>
    </tr>`;
});

document.getElementById('summary').innerHTML =
  `<strong>Resultado:</strong> ${passed}/${passed+failed} testes ${failed===0?'✅ TODOS PASSARAM':'❌ '+failed+' FALHA(S)'}`;
</script>
</body>
</html>
