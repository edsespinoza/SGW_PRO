<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Login Test</title></head>
<body style="background:#111;color:#eee;font-family:monospace;padding:2rem">
<p>Test 1: Health check...</p>
<script>
(async()=>{
  try{
    const h=await fetch('/api/v1/health');
    const ht=await h.text();
    document.body.innerHTML+=`<p style="color:#0f0">✓ Health: ${ht}</p>`;
  }catch(e){
    document.body.innerHTML+=`<p style="color:#f00">✗ Health: ${e.message}</p>`;
  }

  try{
    const r=await fetch('/api/v1/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:'admin',password:'admin123'}),
    });
    const rt=await r.text();
    document.body.innerHTML+=`<p style="color:#0f0">✓ Login: ${rt}</p>`;
  }catch(e){
    document.body.innerHTML+=`<p style="color:#f00">✗ Login: ${e.message}</p>`;
  }

  try{
    const r2=await fetch('/api/v1/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:'{"username":"admin","password":"admin123"}',
    });
    const r2t=await r2.text();
    document.body.innerHTML+=`<p style="color:#0f0">✓ Login2: ${r2t}</p>`;
  }catch(e){
    document.body.innerHTML+=`<p style="color:#f00">✗ Login2: ${e.message}</p>`;
  }

  try{
    const r3=await fetch('/api/v1/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:'{username: admin, password: admin123}',
    });
    const r3t=await r3.text();
    document.body.innerHTML+=`<p style="color:#ff0">?! Login3: ${r3t}</p>`;
  }catch(e){
    document.body.innerHTML+=`<p style="color:#f00">✗ Login3: ${e.message}</p>`;
  }
})();
</script>
</body>
</html>
